{% extends "admin_base.html" %}

{% block title %}Admin Settings — CivicAssist{% endblock %}
{% block page_title %}Admin Settings{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <!-- Profile Settings -->
    <div
        class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 dark:border-slate-800">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">person</span>Profile Settings
            </h3>
        </div>
        <form method="post" action="{{ url_for('admin_settings') }}" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                <input type="text" name="name" value="{{ admin.name }}"
                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" value="{{ admin.email }}"
                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone</label>
                <input type="text" name="phone" value="{{ admin.phone or '' }}"
                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
                <input type="text" value="{{ admin.username }}" disabled
                    class="w-full bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed" />
                <p class="text-xs text-slate-400 mt-1">Username cannot be changed.</p>
            </div>
            <hr class="border-slate-200 dark:border-slate-800">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">New Password</label>
                    <input type="password" name="new_password" minlength="8"
                        placeholder="Leave blank to keep current"
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
                    <p class="text-xs text-slate-400 mt-1">Minimum 8 characters.</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Confirm New Password</label>
                    <input type="password" name="confirm_password" minlength="8"
                        placeholder="Confirm new password"
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
                </div>
            </div>
            <button type="submit"
                class="bg-primary hover:bg-primary/90 text-white font-bold py-2.5 px-6 rounded-lg shadow-sm transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">save</span>Save Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
